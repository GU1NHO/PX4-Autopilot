module_name: mc_pos_control
parameters:
- group: Multicopter Position Control
  definitions:
    MPC_Z_P:
      description:
        short: Proportional gain for vertical position error
        long: Defined as corrective velocity in m/s per m position error
      type: float
      default: 1.0
      min: 0.1
      max: 1.5
      decimal: 2
      increment: 0.1
    MPC_XY_P:
      description:
        short: Proportional gain for horizontal position error
        long: Defined as corrective velocity in m/s per m position error
      type: float
      default: 0.95
      min: 0
      max: 2
      decimal: 2
      increment: 0.1
    MPC_Z_VEL_P_ACC:
      description:
        short: Proportional gain for vertical velocity error
        long: Defined as corrective acceleration in m/s^2 per m/s velocity error
      type: float
      default: 4.0
      min: 2
      max: 15
      decimal: 2
      increment: 0.1
    MPC_XY_VEL_P_ACC:
      description:
        short: Proportional gain for horizontal velocity error
        long: Defined as corrective acceleration in m/s^2 per m/s velocity error
      type: float
      default: 1.8
      min: 1.2
      max: 5
      decimal: 2
      increment: 0.1
    MPC_Z_VEL_I_ACC:
      description:
        short: Integral gain for vertical velocity error
        long: Defined as corrective acceleration in m/s^2 per m velocity integral
      type: float
      default: 2.0
      min: 0.2
      max: 3
      decimal: 2
      increment: 0.1
    MPC_XY_VEL_I_ACC:
      description:
        short: Integral gain for horizontal velocity error
        long: |-
          Defined as correction acceleration in m/s^2 per m velocity integral
          Allows to eliminate steady state errors in disturbances like wind.
      type: float
      default: 0.4
      min: 0
      max: 60
      decimal: 2
      increment: 0.02
    MPC_Z_VEL_D_ACC:
      description:
        short: Differential gain for vertical velocity error
        long: Defined as corrective acceleration in m/s^2 per m/s^2 velocity derivative
      type: float
      default: 0.0
      min: 0
      max: 2
      decimal: 2
      increment: 0.02
    MPC_XY_VEL_D_ACC:
      description:
        short: Differential gain for horizontal velocity error
        long: Defined as corrective acceleration in m/s^2 per m/s^2 velocity derivative
      type: float
      default: 0.2
      min: 0.1
      max: 2
      decimal: 2
      increment: 0.02

    MPC_RNG_ALT_KP:
      description:
        short: Proportional gain for rangefinder-based altitude control
        long: >
          Gain applied to the altitude error (target - measured) from the
          rangefinder. Produces a corrective vertical acceleration in m/s^2
          per meter of altitude error. Only used when MPC_RNG_ALT_EN is true.
      type: float
      default: 3.0
      min: 0.0
      max: 10.0
      decimal: 2
      increment: 0.1

    MPC_RNG_ALT_KD:
      description:
        short: Derivative gain for rangefinder-based altitude control
        long: >
          Gain applied to the vertical velocity to damp altitude overshoot.
          Produces a corrective vertical acceleration in m/s^2 per m/s of
          vertical velocity. Only used when MPC_RNG_ALT_EN is true.
      type: float
      default: 2.0
      min: 0.0
      max: 10.0
      decimal: 2
      increment: 0.1

    MPC_RNG_ALT_EN:
      description:
        short: Enable rangefinder-based altitude controller
        long: >
          When enabled, replaces the standard vertical position/velocity loop
          with a direct PD controller using the downward-facing rangefinder.
          Horizontal control and all safety systems remain unaffected.
          Requires a valid distance_sensor topic with
          ROTATION_DOWNWARD_FACING.
      type: int32
      default: 0
      min: 0
      max: 1
